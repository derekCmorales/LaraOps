name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install root (worker + wrangler)
        run: npm ci
      - name: Install web
        run: npm ci --prefix web
      - name: Worker tests
        run: npm run test:worker
      - name: Build SPA
        run: npm run build:web
      - name: Require Cloudflare secrets
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secret CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions)."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Falta el secret CLOUDFLARE_ACCOUNT_ID (Settings → Secrets and variables → Actions)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "El token de Cloudflare necesita Account → Cloudflare Pages → Edit."
            exit 1
          fi
      - name: Deploy Pages
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          exists=0
          if list_json=$(npx wrangler pages project list --json); then
            echo "$list_json"
            if echo "$list_json" | grep -qiE '"(name|Project Name)"[[:space:]]*:[[:space:]]*"laraops"'; then
              echo "El proyecto Pages laraops ya existe."
              exists=1
            fi
          else
            echo "No se pudo listar proyectos Pages; se intentará crear o desplegar igual."
          fi
          if [ "$exists" -eq 0 ]; then
            echo "Creando proyecto Pages laraops (primera vez)."
            http=$(curl -sS -o /tmp/cf-create.json -w "%{http_code}" \
              -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"name":"laraops","production_branch":"main"}' || true)
            echo "create_http=${http:-000}"
            cat /tmp/cf-create.json 2>/dev/null || true
            echo
            if [ "${http:-000}" = "200" ] || [ "${http:-000}" = "409" ]; then
              echo "Proyecto Pages laraops listo (HTTP ${http})."
            else
              echo "::error::CLOUDFLARE_API_TOKEN no pudo crear el proyecto Pages (HTTP ${http:-000}). En Cloudflare → API Tokens, el permiso tiene que ser Account → Cloudflare Pages → Edit (no Read). Luego actualiza el secret del repo y relanza este workflow."
              exit 1
            fi
          fi
          npx wrangler pages deploy web/dist --project-name=laraops --branch main --commit-dirty=true
