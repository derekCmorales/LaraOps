name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install root (worker + wrangler)
        run: npm ci
      - name: Install web
        run: npm ci --prefix web
      - name: Worker tests
        run: npm run test:worker
      - name: Build SPA
        run: npm run build:web
      - name: Require Cloudflare secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secret CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions)."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Falta el secret CLOUDFLARE_ACCOUNT_ID (Settings → Secrets and variables → Actions)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "El token de Cloudflare necesita Account → Cloudflare Pages → Edit."
            exit 1
          fi
      - name: Deploy Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=laraops
